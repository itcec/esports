<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff Login — CEC Esports Intramurals 2026</title>
  <script src="https://cdn.tailwindcss.com"></script><script src="assets/js/site-config.js"></script>
  <script src="assets/js/firebase-config.js"></script>
  <script src="assets/js/auth-guard.js"></script>
</head>
<body class="min-h-screen bg-[#081422] text-[#d7e3f7] grid place-items-center p-6">
  <main class="w-full max-w-lg">
    <a href="index.html" class="text-[#b4c5ff] text-sm font-bold">← Public site</a>
    <section class="mt-5 rounded-2xl border border-[#424656] bg-[#15202f] p-7 shadow-2xl">
      <p class="text-xs font-bold tracking-[.18em] text-[#b4c5ff]">CEC ESPORTS · STAFF PORTAL</p>
      <h1 class="mt-3 text-3xl font-black">Tournament Control Login</h1>
      <p class="mt-3 text-sm leading-6 text-[#c2c6d8]">Sign in with Google. New accounts remain pending until the coordinator approves them.</p>
      <div id="state" class="mt-6 rounded-xl border border-[#424656] bg-[#101c2a] p-4 text-sm">Checking authentication…</div>
      <button id="sign-in" type="button" class="mt-5 w-full rounded-lg bg-[#b4c5ff] px-4 py-3 font-bold text-[#002a78]">SIGN IN WITH GOOGLE</button>
      <button id="sign-out" type="button" class="mt-3 hidden w-full rounded-lg border border-[#8c90a2] px-4 py-3 font-bold">SIGN OUT</button>
      <div id="approved-actions" class="mt-4 hidden grid gap-3 sm:grid-cols-2">
        <a href="/control-center" class="rounded-lg bg-[#1264ff] px-4 py-3 text-center font-bold text-white">CONTROL CENTER</a>
        <a href="admin-officiating.html" class="rounded-lg border border-[#b4c5ff] px-4 py-3 text-center font-bold text-[#b4c5ff]">LIVE MATCHES</a>
      </div>
      <button id="recheck" type="button" class="mt-3 hidden w-full rounded-lg border border-[#b4c5ff] px-4 py-3 font-bold text-[#b4c5ff]">CHECK APPROVAL STATUS</button>
    </section>
  </main>
  <script>
    (function () {
      const state = document.getElementById('state');
      const signIn = document.getElementById('sign-in');
      const signOut = document.getElementById('sign-out');
      const actions = document.getElementById('approved-actions');
      const recheck = document.getElementById('recheck');
      let redirected = false;
      function render(user, profile) {
        signIn.classList.toggle('hidden', !!user);
        signOut.classList.toggle('hidden', !user);
        recheck.classList.toggle('hidden', !user || !profile || profile.status === 'approved');
        actions.classList.toggle('hidden', !(user && window.CECAuth.isApprovedStaff()));
        if (!user) { state.textContent = 'Not signed in. Staff access is restricted to approved Google accounts.'; return; }
        if (window.CECAuth.isApprovedStaff()) {
          state.textContent = 'Approved: ' + (profile.roleLabel || 'Staff') + '. Opening the control center…';
          if (!redirected) { redirected = true; window.location.replace('/control-center'); }
        }
        else if (profile && profile.status === 'rejected') state.textContent = 'Access revoked. Contact the tournament coordinator.';
        else state.textContent = 'Signed in as ' + (user.email || 'staff member') + '. Awaiting coordinator approval.';
      }
      signIn.addEventListener('click', async function () { signIn.disabled = true; state.textContent = 'Opening Google sign-in…'; try { await window.CECAuth.signInWithGoogle(); } catch (e) { state.textContent = e.message || 'Sign-in failed.'; } finally { signIn.disabled = false; } });
      signOut.addEventListener('click', function () { window.CECAuth.signOut(); });
      recheck.addEventListener('click', async function () { recheck.disabled = true; await window.CECAuth.refreshProfile(); recheck.disabled = false; });
      window.CECAuth.onAuthChange(render);
    }());
  </script>
</body>
</html>
