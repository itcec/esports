<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CEC MLBB • OBS Frame</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#fff;font-family:Arial,sans-serif}#frame{position:absolute;width:1920px;height:1080px;transform-origin:top left;pointer-events:none}.bar{position:absolute;left:340px;top:42px;width:1250px;height:64px;display:grid;grid-template-columns:110px 1fr 160px 1fr 110px;background:#070b12;border-block:2px solid #e7c76d;box-shadow:0 4px 12px #0009}.crest{position:relative;top:-42px;height:104px;display:grid;place-items:center;background:linear-gradient(145deg,#172030,#000);border:2px solid #e7c76d}.crest img{width:84px;height:84px;object-fit:contain}.side{display:flex;align-items:center;gap:14px;padding:0 20px;min-width:0;background:linear-gradient(110deg,#c4a251,#ffedaa 45%,#b28a37);color:#080b11}.right{flex-direction:row-reverse;text-align:right}.initial{flex:1;min-width:0;font-size:28px;font-weight:900;font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.score{font-size:26px;font-weight:900}.center{position:relative;display:grid;place-items:center}.center img{position:absolute;width:98px;height:92px;object-fit:contain;filter:drop-shadow(0 3px 4px #000)}.ad{position:absolute;left:1590px;top:0;width:330px;height:106px;background:linear-gradient(120deg,#101722,#040609);border:2px solid #e7c76d;display:grid;place-items:center;overflow:hidden}.ad img{width:100%;height:100%;object-fit:contain}.ad span{padding:12px;text-align:center;font-size:21px;font-weight:800}.stage{position:absolute;right:0;top:112px;max-width:330px;padding:7px 16px;background:#080e18ed;border-bottom:2px solid #e7c76d;text-align:right;font-size:16px;font-weight:800;text-transform:uppercase}.player{position:absolute;bottom:0;width:342px;height:218px;padding:65px 22px 18px;background:linear-gradient(0deg,#030913f5,#081528d9 75%,#08152888);border:2px solid #e7c76d;border-bottom:0;display:flex;flex-direction:column;justify-content:end;gap:6px}.player.left{left:0;border-left:0;box-shadow:inset 4px 0 #369eff}.player.right{right:0;border-right:0;box-shadow:inset -4px 0 #ff6770}.teamname{color:#e7c76d;font-size:17px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ign{font-size:29px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.role{font-size:17px;color:#d0d8e4;letter-spacing:2px;text-transform:uppercase}.preview{background:repeating-conic-gradient(#18202b 0% 25%,#222c39 0% 50%) 0/32px 32px}.green{background:#00b961}#controls{display:none}body.control{overflow:auto;background:#080e18;padding:28px}body.control #frame{display:none}body.control #controls{display:block;max-width:1000px;margin:auto}h1{font-size:28px}p{color:#b8c4d4;line-height:1.5}fieldset{border:1px solid #33445b;padding:20px;margin:18px 0;border-radius:12px}label{display:block;margin:12px 0;font-size:14px}input,select{display:block;width:100%;margin-top:7px;padding:11px;background:#111e30;border:1px solid #425571;border-radius:6px;color:white}button,a.button{display:inline-block;padding:12px 18px;margin:6px 5px 6px 0;border:0;border-radius:6px;background:#e7c76d;color:#080e18;font-weight:bold;text-decoration:none;cursor:pointer}.columns{display:grid;grid-template-columns:1fr 1fr;gap:20px}#notice{white-space:pre-wrap;color:#ffe19b}code{overflow-wrap:anywhere}@media(max-width:650px){.columns{grid-template-columns:1fr}}
</style></head><body><main id="frame"><div class="bar"><div class="crest"><img id="logo1" alt="Blue team"></div><div class="side"><span class="initial" id="initial1">BLUE</span><span class="score" id="score1">0</span></div><div class="center"><img src="assets/intrams_logo.png" alt="CEC Intramurals"></div><div class="side right"><span class="initial" id="initial2">RED</span><span class="score" id="score2">0</span></div><div class="crest"><img id="logo2" alt="Red team"></div></div><div class="ad"><img id="adImage" alt="Advertisement" hidden><span id="adText"></span></div><div class="stage" id="stage"></div><div class="player left"><div class="teamname" id="team1"></div><div class="ign" id="ign1"></div><div class="role" id="role1"></div></div><div class="player right"><div class="teamname" id="team2"></div><div class="ign" id="ign2"></div><div class="role" id="role2"></div></div></main>
<main id="controls"><h1>CEC Broadcast Control</h1><p>Publish changes here to update the separate OBS source in real time.</p><a class="button" id="open" target="_blank">Open OBS source</a><a class="button" href="?preview=1" target="_blank">Preview frame</a><button id="login">Staff sign in</button><p>OBS Browser Source: <code id="url"></code><br>1920 × 1080 · Place above your game capture · Transparent background</p><label>Published match<select id="match"></select></label><button id="swap" type="button">Swap blue / red sides live</button><p id="orientation"></p><form id="form"><fieldset><legend>Broadcast details</legend><label>Stage / format<input name="stage" placeholder="SHS ROUND ROBIN · BO1"></label><label>Advertisement text (blank leaves an empty slot)<input name="adText" maxlength="100"></label><label>Advertisement image URL<input name="adImage" type="url"></label></fieldset><div class="columns" id="sides"></div><button id="publish">Publish overlay changes</button></form><p id="notice" role="status">Connecting…</p></main><script src="assets/js/firebase-config.js"></script><script>
'use strict';const q=new URLSearchParams(location.search),control=q.has('control'),$=id=>document.getElementById(id),form=$('form');document.body.classList.toggle('control',control);document.body.classList.toggle('preview',q.has('preview'));document.body.classList.toggle('green',q.get('bg')==='green');function resize(){$('frame').style.transform='scale('+Math.min(innerWidth/1920,innerHeight/1080)+')'}addEventListener('resize',resize);resize();
const fallback='assets/e-sportslogo.png';function image(id,v){const el=$(id);let src=fallback;try{const u=new URL(v||fallback,location.href);if(['https:','http:'].includes(u.protocol))src=u.href}catch{}el.onerror=()=>{el.onerror=null;el.src=fallback};el.src=src}function put(id,v){$(id).textContent=v==null?'':String(v)}let matches={},active='',selected='',loaded='';function current(){return matches[control?selected:(q.get('match')||active)]||null}
function render(){const m=current()||{},o=m.obsOverlay||{};for(let n=1;n<=2;n++){const source=m.obsSwap?3-n:n,t=m['team'+source]||{},p=(t.roster||[])[0]||{};put('initial'+n,o['initial'+source]||t.initials||t.shortName||t.dept||t.name||'TBD');put('score'+n,t.score??0);put('team'+n,t.name||'TEAM TBA');put('ign'+n,o['ign'+source]||p.ign||'PLAYER IGN');put('role'+n,o['role'+source]||p.role||'POSITION');image('logo'+n,o['logo'+source]||t.logoUrl||t.icon||t.emblem)}put('stage',o.stage||m.stageTitle||m.stage||'CEC INTRAMURALS 2026');put('adText',o.adText||'');$('adImage').hidden=!o.adImage;$('adText').hidden=!!o.adImage;if(o.adImage)image('adImage',o.adImage)}function load(){const m=current();if(!m)return;const o=m.obsOverlay||{};for(const el of form.elements)if(el.name)el.value=o[el.name]||'';loaded=selected;put('notice','Editing '+(m.title||selected)+'. Publish when ready.')}
function refresh(){if(control){put('orientation',current()?.obsSwap?'Sides swapped: Team 2 on blue / Team 1 on red':'Normal sides: Team 1 on blue / Team 2 on red');const previous=selected;$('match').replaceChildren(new Option('Choose match',''));for(const[id,m]of Object.entries(matches))$('match').add(new Option((m.team1?.name||'TBA')+' vs '+(m.team2?.name||'TBA')+' · '+id,id));selected=matches[previous]?previous:(matches[active]?active:'');$('match').value=selected;if(loaded!==selected)load()}render()}
if(control){$('swap').onclick=async()=>{if(!selected)return put('notice','Choose a match first.');if(!CECFirebase.auth?.currentUser)return put('notice','Staff sign in required.');$('swap').disabled=true;try{await CECFirebase.db.ref('liveMatches/'+selected+'/obsSwap').transaction(v=>!v);await CECFirebase.db.ref('activeMatchId').set(selected);put('notice','Sides swapped live. Team scores and tournament results are unchanged.')}catch(e){put('notice','Could not swap: '+e.message)}finally{$('swap').disabled=false}};const url=new URL(location.pathname,location.origin).href;put('url',url);$('open').href=url;for(let n=1;n<=2;n++){const f=document.createElement('fieldset'),legend=document.createElement('legend');legend.textContent='Team '+n+' (details follow team when swapped)';f.append(legend);for(const[key,label]of[['initial','Team initials'],['logo','Team logo URL'],['ign','Player IGN'],['role','Position / role']]){const l=document.createElement('label'),i=document.createElement('input');l.textContent=label;i.name=key+n;i.maxLength=key==='logo'?2000:60;l.append(i);f.append(l)}$('sides').append(f)}$('match').onchange=()=>{selected=$('match').value;load()};$('login').onclick=async()=>{try{await CECFirebase.init();await CECFirebase.auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());put('notice','Signed in. Select a match and publish.')}catch(e){put('notice',e.message)}};form.onsubmit=async e=>{e.preventDefault();if(!selected)return put('notice','Choose a match first.');if(!CECFirebase.auth?.currentUser)return put('notice','Sign in with an approved staff account first.');$('publish').disabled=true;try{await CECFirebase.db.ref('liveMatches/'+selected+'/obsOverlay').set(Object.fromEntries(new FormData(form)));await CECFirebase.db.ref('activeMatchId').set(selected);put('notice','Published. OBS is showing this match.')}catch(e){put('notice','Could not publish: '+e.message)}finally{$('publish').disabled=false}}}
render();CECFirebase.init().then(()=>{if(!CECFirebase.db)throw Error('Connection unavailable');CECFirebase.db.ref('activeMatchId').on('value',s=>{active=s.val()||'';refresh()});CECFirebase.db.ref('liveMatches').on('value',s=>{matches=s.val()||{};refresh()},e=>put('notice',e.message))}).catch(e=>put('notice',e.message));
</script></body></html>
